<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Cargadores Electricos Iberdrola</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6f8;
            color: #24313d;
        }

        header {
            background: #073b32;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        header p {
            margin: 0;
            color: #d5e8e2;
        }

        main {
            max-width: 1050px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .buscador {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #0000000d;
        }

        .buscador label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .controles {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #ccd5d9;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 13px 20px;
            background: #087b58;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #065e43;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .resumen {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 22px 0;
        }

        .indicador {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .indicador strong {
            display: block;
            font-size: 30px;
            margin-bottom: 5px;
        }

        .indicador span {
            color: #64727c;
            font-size: 14px;
        }

        .filtros {
            display: flex;
            gap: 8px;
            margin: 22px 0;
            flex-wrap: wrap;
        }

        .filtros button {
            background: #e1e9e7;
            color: #24443b;
        }

        .filtros button.activo {
            background: #087b58;
            color: white;
        }

        #resultados {
            display: grid;
            gap: 14px;
        }

        .cargador {
            background: white;
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #89959b;
            box-shadow: 0 2px 8px #00000008;
        }

        .cargador.disponible {
            border-left-color: #15945e;
        }

        .cargador.ocupado {
            border-left-color: #d64b4b;
        }

        .cargador h3 {
            margin: 0 0 10px;
        }

        .direccion {
            color: #64727c;
            margin-bottom: 14px;
        }

        .estado {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .estado.disponible {
            background: #d9f4e6;
            color: #087443;
        }

        .estado.ocupado {
            background: #fde3e3;
            color: #a72e2e;
        }

        .estado.desconocido {
            background: #edf0f2;
            color: #58646c;
        }

        /* Estado del cargador y acceso a Google Maps */

        .enlace-maps {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 12px;
            border-radius: 6px;
            background: #e8eef7;
            color: #315b91;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #cbd8e8;
            transition: background 0.2s;
        }

        .enlace-maps:hover {
            background: #d5e2f2;
        }

        .detalle {
            font-size: 14px;
            line-height: 1.6;
        }

        /* Información individual de cada toma */
        .tomas-lista {
            margin-top: 16px;
            display: grid;
            gap: 10px;
        }

        .toma {
            padding: 14px;
            border: 1px solid #dce5e1;
            border-radius: 8px;
            background: #f8faf9;
        }

        .toma.gratuita {
            border: 1px solid #15945e;
            background: #f0faf4;
        }

        .toma-cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
        }

        .precio.gratis {
            color: #087443;
        }

        .etiqueta-gratis {
            background: #d9f4e6;
            color: #087443;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .toma-datos {
            font-size: 14px;
            line-height: 1.7;
        }


        .mensaje {
            background: white;
            padding: 22px;
            border-radius: 10px;
            text-align: center;
            color: #64727c;
        }

        .cabecera-cargador {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .cabecera-cargador h3 {
            margin: 0;
            flex: 1;
            min-width: 0;
        }

        .cabecera-cargador .estado {
            flex-shrink: 0;
        }

        .fila-direccion {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .fila-direccion .direccion {
            flex: 1;
            min-width: 0;
        }

        .fila-direccion .enlace-maps {
            flex-shrink: 0;
        }

        .error {
            color: #a72e2e;
            background: #fde3e3;
        }

        footer {
            text-align: center;
            padding: 30px 15px;
            color: #7b878e;
            font-size: 13px;
        }

        .fila-vigilancia {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .boton-vigilancia {
            width: auto;
            display: inline-block;
            padding: 9px 14px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 21px;
            }

            .controles {
                flex-direction: column;
            }

            .resumen {
                gap: 8px;
            }

            .indicador {
                padding: 14px 5px;
            }

            .indicador strong {
                font-size: 24px;
            }

            .indicador span {
                font-size: 12px;
            }

        }
    </style>
</head>

<body>

    <header>
        <h1>Buscador de Cargadores</h1>
        <p>Consulta los puntos de recarga de Iberdrola</p>
    </header>

    <main>

        <section class="buscador">
            <label for="localidad">¿Dónde quieres buscar?</label>

            <div class="controles">
                <input type="text" id="localidad" placeholder="Ejemplo: Ontinyent" value="Ontinyent">

                <button id="btnBuscar" onclick="buscarCargadores()">
                    Buscar cargadores
                </button>
            </div>
        </section>

        <section class="resumen">
            <div class="indicador">
                <strong id="total">0</strong>
                <span>Cargadores encontrados</span>
            </div>

            <div class="indicador">
                <strong id="disponibles">0</strong>
                <span>Con tomas libres</span>
            </div>

            <div class="indicador">
                <strong id="ocupados">0</strong>
                <span>Sin tomas libres</span>
            </div>

            <div class="indicador">
                <strong id="desconocidos">0</strong>
                <span>Estado desconocido</span>
            </div>
        </section>

        <section class="filtros">
            <button class="activo" onclick="filtrar('todos', this)">Todos</button>
            <button onclick="filtrar('disponibles', this)">Disponibles</button>
            <button onclick="filtrar('ocupados', this)">Ocupados</button>
        </section>

        <section id="resultados">
            <div class="mensaje">
                Introduce una localidad para comenzar la búsqueda.
            </div>
        </section>


    </main>

    <footer>
        Buscador de puntos de recarga · Datos de Iberdrola y Feníe Energía
    </footer>

    <script>
        let cargadores = [];
        let filtroActual = "todos";


        async function buscarCargadores() {

            const localidad = document.getElementById("localidad")
                .value.trim();

            const boton = document.getElementById("btnBuscar");
            const resultados = document.getElementById("resultados");

            if (!localidad) {
                alert("Introduce una localidad.");
                return;
            }

            boton.disabled = true;
            boton.textContent = "Buscando...";

            resultados.innerHTML =
                '<div class="mensaje">Consultando Iberdrola y Feníe Energía...</div>';

            try {

                const consultar = async (url) => {
                    const respuesta = await fetch(url);
                    const datos = await respuesta.json();

                    if (!respuesta.ok) {
                        throw new Error(datos.detail || "Error en la búsqueda.");
                    }

                    return datos;
                };

                // Consultamos los dos operadores simultáneamente.
                const [resultadoIberdrola, resultadoFenie] =
                    await Promise.allSettled([
                        consultar(
                            "/api/cargadores?localidad=" +
                            encodeURIComponent(localidad)
                        ),
                        consultar(
                            "/api/fenie?localidad=" +
                            encodeURIComponent(localidad)
                        )
                    ]);

                if (
                    resultadoIberdrola.status === "rejected" &&
                    resultadoFenie.status === "rejected"
                ) {
                    throw new Error("No se pudo consultar ninguno de los operadores.");
                }

                cargadores = [];

                // Datos de Iberdrola.
                if (resultadoIberdrola.status === "fulfilled") {

                    const puntos =
                        resultadoIberdrola.value.cargadores || [];

                    cargadores.push(
                        ...puntos.map(c => ({
                            ...c,
                            operador: "iberdrola"
                        }))
                    );

                } else {
                    console.error(
                        "Error consultando Iberdrola:",
                        resultadoIberdrola.reason
                    );
                }

                // Datos de Feníe Energía.
                if (resultadoFenie.status === "fulfilled") {

                    const puntos =
                        resultadoFenie.value.cargadores || [];

                    cargadores.push(
                        ...puntos.map(c => {

                            const conectores = c.conectores || [];

                            return {
                                ...c,
                                operador: "fenie",

                                // Adaptamos los conectores al formato
                                // que utiliza actualmente Iberdrola.
                                tomas_detalle: conectores.map(toma => ({
                                    conector: toma.tipo,
                                    potencia: toma.potencia,
                                    precio: c.gratuito === true
                                        ? 0
                                        : c.precio_kwh,
                                    estado: toma.estado
                                })),

                                tomas_ocupadas: conectores.filter(toma =>
                                    [
                                        "Occupied",
                                        "Charging",
                                        "Finishing",
                                        "Preparing",
                                        "Reserved",
                                        "SuspendedEV",
                                        "SuspendedEVSE"
                                    ].includes(toma.estado)
                                ).length,

                                resumen: "Feníe Energía"
                            };
                        })
                    );

                } else {
                    console.error(
                        "Error consultando Feníe:",
                        resultadoFenie.reason
                    );
                }

                filtroActual = "todos";

                document.querySelectorAll(".filtros button")
                    .forEach((b, i) => {
                        b.classList.toggle("activo", i === 0);
                    });

                actualizarResumen();
                mostrarCargadores();

            } catch (error) {

                resultados.innerHTML =
                    '<div class="mensaje error">' +
                    escapar(error.message) +
                    '</div>';

            } finally {

                boton.disabled = false;
                boton.textContent = "Buscar cargadores";
            }
        }


        function actualizarResumen() {

            document.getElementById("total").textContent =
                cargadores.length;

            document.getElementById("disponibles").textContent =
                cargadores.filter(c => c.disponible === true).length;

            document.getElementById("ocupados").textContent =
                cargadores.filter(c => c.disponible === false).length;
        }

        function filtrar(tipo, boton) {

            filtroActual = tipo;

            document.querySelectorAll(".filtros button")
                .forEach(b => b.classList.remove("activo"));

            boton.classList.add("activo");

            mostrarCargadores();
        }

        function mostrarCargadores() {

            const contenedor = document.getElementById("resultados");

            let lista = [...cargadores];

            lista.sort((a, b) => {

                // Disponibles primero
                if (a.disponible === true && b.disponible !== true) return -1;
                if (a.disponible !== true && b.disponible === true) return 1;

                // Desconocidos al final
                if (a.disponible === null && b.disponible === false) return 1;
                if (a.disponible === false && b.disponible === null) return -1;

                // Entre disponibles, más tomas libres primero
                return (b.tomas_disponibles ?? 0) -
                    (a.tomas_disponibles ?? 0);
            });

            if (filtroActual === "disponibles") {
                lista = cargadores.filter(c => c.disponible === true);
            }

            if (filtroActual === "ocupados") {
                lista = cargadores.filter(c => c.disponible === false);
            }

            if (lista.length === 0) {
                contenedor.innerHTML =
                    '<div class="mensaje">No hay cargadores en esta categoría.</div>';
                return;
            }

            contenedor.innerHTML = lista.map(c => {

                let estado = "desconocido";
                let etiqueta = "ESTADO DESCONOCIDO";

                if (c.disponible === true) {
                    estado = "disponible";
                    etiqueta = "DISPONIBLE";
                } else if (c.disponible === false) {
                    estado = "ocupado";
                    etiqueta = "OCUPADO";
                }

                const esFenie = c.operador === "fenie";

                const logoOperador = esFenie
                    ? "/iconos/fenie.png"
                    : "/iconos/iberdrola.png";

                const htmlTomas = (c.tomas_detalle || []).map((toma, index) => {

                    const precioDisponible =
                        toma.precio !== null &&
                        toma.precio !== undefined &&
                        toma.precio !== "";

                    const gratuita = precioDisponible && Number(toma.precio) === 0;

                    const precioTexto = precioDisponible
                        ? `${Number(toma.precio).toFixed(2).replace(".", ",")} €/kWh`
                        : (esFenie ? "Sin tarifa registrada" : "Precio no disponible");

                    const estadoCodigo = String(toma.estado || "").toUpperCase();

                    const estadoToma = estadoCodigo === "AVAILABLE"
                        ? "Disponible"
                        : ["OCCUPIED", "CHARGING", "FINISHING", "PREPARING",
                            "RESERVED", "SUSPENDEDEV", "SUSPENDEDEVSE"].includes(estadoCodigo)
                            ? "Ocupada"
                            : estadoCodigo === "FAULTED"
                                ? "Averiada"
                                : estadoCodigo === "UNAVAILABLE"
                                    ? "No disponible"
                                    : "Estado desconocido";

                    const potenciaTexto = toma.potencia != null
                        ? `${escapar(toma.potencia)} kW`
                        : "No disponible";

                    return `
        <div class="toma ${gratuita ? "gratuita" : ""}">
            <div class="toma-cabecera">
                <strong>Toma ${index + 1} - ${escapar(toma.conector || "Conector desconocido")}</strong>
                ${gratuita ? '<span class="etiqueta-gratis">GRATUITA</span>' : ""}
            </div>

            <div class="toma-datos">
                <strong>Precio:</strong>
                <span class="precio ${gratuita ? "gratis" : ""}">
                    ${precioTexto}
                </span><br>

                <strong>Potencia:</strong> ${potenciaTexto}<br>
                <strong>Estado:</strong> ${estadoToma}
            </div>
        </div>
    `;
                }).join("");
                const botonVigilancia =
                    c.operador !== "fenie" && c.disponible === false
                        ? `
                        <button class="boton-vigilancia"
                            onclick="activarVigilancia(${JSON.stringify(c.cuprId)}, this)">
                            Avisarme cuando haya una libre
                        </button>
                    `
                        : "";
                const destinoMaps =
                    c.latitud != null && c.longitud != null
                        ? `${c.latitud},${c.longitud}`
                        : (c.direccion || c.nombre || c.localidad || "");

                const urlMaps =
                    `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destinoMaps)}`;

                return `
            <article class="cargador ${estado}">
                <div class="cabecera-cargador">
                    <div class="identidad-cargador">
                        <img
                            src="${logoOperador}"
                            alt="${esFenie ? "Feníe Energía" : "Iberdrola"}"
                            style="width: 30px; height: 30px; object-fit: contain;">
                        <div>
                            <h4>${escapar(c.nombre)} | 
                            
                                ${esFenie
                        ? `Feníe Energía · iD: ${escapar(c.codigo)}`
                        : `Iberdrola · ID: ${escapar(c.cuprId)}`}
                            </h4>
                        </div>
                    </div>
                    <span class="estado ${estado}">${etiqueta}</span>
                    </div>

                    <div class="fila-direccion">
                        <div class="direccion">
                            ${escapar(c.direccion || c.localidad || "")}
                        </div>

                        <a href="${urlMaps}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="enlace-maps">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                        <circle cx="12" cy="10" r="2.5"/>
                        </svg>
                        Cómo llegar
                        </a>
                    </div>
                <div class="fila-vigilancia">
                    ${botonVigilancia}
                </div>
                <div class="detalle">
                    <strong>Tomas totales:</strong> ${c.tomas ?? 0}<br>
                    <strong>Tomas libres:</strong> ${c.tomas_disponibles ?? 0}<br>
                    <strong>Tomas ocupadas:</strong> ${c.tomas_ocupadas ?? 0}<br>
                    <strong>Detalle:</strong> ${escapar(c.resumen || "")}
                </div>

                ${htmlTomas ? `<div class="tomas-lista">${htmlTomas}</div>` : ""}
                
            </article>
            `;

            }).join("");
        }
        async function activarVigilancia(cuprId, boton) {

            const cargador = cargadores.find(
                c => String(c.cuprId) === String(cuprId)
            );

            if (!cargador) {
                alert("No se han podido obtener los datos del cargador.");
                return;
            }

            boton.disabled = true;
            boton.textContent = "Iniciando vigilancia...";

            try {

                const respuesta = await fetch("/api/vigilancia", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        cuprId: cargador.cuprId,
                        nombre: cargador.nombre,
                        direccion: cargador.direccion || "",
                        localidad: cargador.localidad || ""
                    })
                });

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(datos.detail || "No se pudo iniciar la vigilancia.");
                }

                boton.textContent = "Vigilancia activada";
                alert(datos.mensaje);

            } catch (error) {

                boton.disabled = false;
                boton.textContent = "Avisarme cuando haya una libre";

                alert("Error: " + error.message);
            }
        }

        function escapar(valor) {
            return String(valor ?? "").replace(/[&<>"']/g, caracter => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[caracter]);
        }

        document.getElementById("localidad")
            .addEventListener("keydown", evento => {
                if (evento.key === "Enter") {
                    buscarCargadores();
                }
            });

    </script>

</body>

</html>
